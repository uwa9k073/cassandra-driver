name: Doxygen Docs

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  # Задача 1: Сборка документации и подготовка артефактов
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build docs
        run: doxygen scripts/docs/doxygen.conf

      # Для Pull Request: обычный артефакт для проверки
      - name: Upload generated docs (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4 # Исправлено для обратной совместимости, обычно actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: docs/html/

      # Для Push: специальный артефакт для GitHub Pages
      - name: Upload Pages artifact (Push)
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html/

  # Задача 2: Развертывание (запускается ТОЛЬКО при пуше и ПОСЛЕ успешной сборки)
  deploy-docs:
    if: github.event_name == 'push'
    needs: build-docs
    runs-on: ubuntu-latest

    # КРИТИЧЕСКИЙ БЛОК: активирует вкладку Deployments в GitHub UI
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
